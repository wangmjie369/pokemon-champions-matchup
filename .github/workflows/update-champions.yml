name: Update Champions data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh roster, moves and abilities
        run: python scripts/update-champions-data.py
      - name: Refresh usage data
        run: node scripts/update-usage.js
      - name: Build update pack
        run: node scripts/build-update-pack.js
      - name: Commit changes
        run: |
          git config user.name 'champions-update-bot'
          git config user.email 'champions-update-bot@users.noreply.github.com'
          git add data/champions-data.js data/champions-zh.js data/usage-mc.js data/version.js update
          git diff --cached --quiet && exit 0
          git commit -m 'Update Pokémon Champions data'
          git push
